# Builds the web Worker onto https://dev.maelstrom.iexdevs.com only when asked.
# Actions → Dev page → Run workflow, or comment `/dev` on a pull request.
# The commenter must be an owner, member, or collaborator.
# GitHub secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# NEXT_PUBLIC_PRIVY_APP_ID. Optional: NEXT_PUBLIC_AGENT_RUNTIME_URL,
# NEXT_PUBLIC_PRIVY_CLIENT_ID, NEXT_PUBLIC_ELEVENLABS_AGENT_ID.
# Server secrets stay on the maelstrom-web-dev Worker. This file has names only.

name: Dev page

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number. Leave empty to build the selected branch.
        required: false
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: maelstrom-web-dev
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/dev') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_PRIVY_APP_ID: ${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}
      NEXT_PUBLIC_PRIVY_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_PRIVY_CLIENT_ID }}
      NEXT_PUBLIC_AGENT_RUNTIME_URL: ${{ secrets.NEXT_PUBLIC_AGENT_RUNTIME_URL }}
      NEXT_PUBLIC_ELEVENLABS_AGENT_ID: ${{ secrets.NEXT_PUBLIC_ELEVENLABS_AGENT_ID }}
    steps:
      - name: Resolve the commit
        id: target
        uses: actions/github-script@v7
        with:
          script: |
            const prInput = `${{ github.event.inputs.pr || '' }}`.trim();
            const prNumber = prInput || (
              context.eventName === 'issue_comment' ? String(context.payload.issue.number) : ''
            );
            if (!prNumber) {
              core.setOutput('sha', context.sha);
              core.setOutput('pr', '');
              core.setOutput('label', context.ref);
              return;
            }
            const { data } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(prNumber),
            });
            core.setOutput('sha', data.head.sha);
            core.setOutput('pr', String(data.number));
            core.setOutput('label', `${data.head.repo.full_name}@${data.head.ref}`);

      - name: Check out that commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          # Wrangler 4.x requires Node >= 22.12 (opennextjs-cloudflare deploy).
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Deploy the dev Worker
        run: npm run deploy:web:dev

      - name: Comment on the pull request
        if: steps.target.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.target.outputs.pr }}
          LABEL: ${{ steps.target.outputs.label }}
        run: |
          gh pr comment "$PR" --body "Dev page is up at https://dev.maelstrom.iexdevs.com from \`$LABEL\`."
