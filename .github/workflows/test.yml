# Runs `npm test` on every pull request and push to dev/main. It includes
# apps/web/lib/workerd-model-call.test.mjs, which runs the chat model call inside
# workerd (Miniflare), so a Fetch option that only breaks on Cloudflare fails here.
# Offline and mocked: no secrets.

name: Test

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
